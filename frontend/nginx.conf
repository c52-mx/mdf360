# Un solo origen: el frontend y la API comparten dominio (sin problemas de cookies ni CSRF).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 60m;  # audios del estudio semanal (hasta 40 MB)

    location /api/    { proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    location /admin/  { proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }
    location /static/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params.conf; }

    # El service worker nunca debe quedar en caché
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Aplicación de una sola página
    location / { try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
}
